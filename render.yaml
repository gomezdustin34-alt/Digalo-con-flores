services:
  - type: web
    name: digalo-con-flores
    env: python
    plan: free
    buildCommand: "pip install -r requirements.txt && flask db upgrade && python seed.py"
    startCommand: "gunicorn wsgi:app"
    envVars:
      - key: FLASK_APP
        value: wsgi.py
      - key: SECRET_KEY
        generateValue: true
      - key: FLASK_DEBUG
        value: "0"
      - key: DATABASE_URL
        fromDatabase:
          name: digalo-con-flores-db
          property: connectionString
      - key: SITE_URL
        sync: false
      - key: CURRENCY
        value: COP
      - key: MAIL_SERVER
        value: smtp.gmail.com
      - key: MAIL_PORT
        value: "587"
      - key: MAIL_USE_TLS
        value: "1"
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: MAIL_DEFAULT_SENDER
        sync: false

databases:
  - name: digalo-con-flores-db
    plan: free
