{% extends "admin/base.html" %}
{% block title %}Contenido del footer — Panel{% endblock %}
{% block page_title %}Footer{% endblock %}

{% block content %}
<div class="admin-panel" style="max-width:700px;">
  <p style="color:var(--ink-faint); font-size:13px; margin-bottom:16px;">Los datos de contacto y redes sociales del footer se editan desde <a href="{{ url_for('admin.settings') }}">Configuración</a>. Aquí puedes ajustar el texto libre.</p>
  <form method="post" novalidate>
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="field"><label>Texto adicional del footer</label><textarea name="footer_text" rows="3">{{ values.footer_text }}</textarea></div>
    <button type="submit" class="btn btn-primary">Guardar cambios</button>
  </form>
</div>
{% endblock %}
